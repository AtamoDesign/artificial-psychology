[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artpsych"
version = "0.1.0"
description = "Shared human-AI visual codes sized to human working memory, plus experiment tools."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Chris Rajtar" }]

[project.optional-dependencies]
render = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
